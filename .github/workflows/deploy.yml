# Build the site here, deploy to Cloudflare Pages by Direct Upload.
#
# WHY NOT CLOUDFLARE'S OWN BUILD SERVICE (Pages Git integration)
#
# It is genuinely the lower-effort option — connect the repo, set a build
# command, get preview deploys free — and it was rejected for three reasons that
# are specific to a benchmark site rather than general preference.
#
#   1. STALENESS IS COMPUTED AT BUILD TIME. Every row's age badge, and the
#      "measured under a superseded harness" marker, are derived from `now`
#      against the record's timestamp. A row therefore goes stale with no commit
#      to trigger a rebuild, and a site that only builds on push would keep
#      asserting a number is current long after it stopped being so. That is the
#      one failure mode this site cannot have, because staleness is the honesty
#      mechanism. A nightly rebuild is a cron here and is not expressible in the
#      Git integration without calling back out to a scheduler anyway.
#
#   2. THE GUARDS LIVE BETWEEN BUILD AND DEPLOY. `if-no-files-found: error` on
#      the artifact exists because a silently-empty build uploads nothing and the
#      deploy then wipes the live site. The file-count ceiling exists because
#      Cloudflare caps files per deployment and the shard count grows with the
#      archive. Both sit in the seam between building and publishing, which the
#      Git integration does not expose.
#
#   3. CLOUDFLARE WOULD NEED READ ACCESS TO THE REPOSITORY. Direct Upload means
#      the only thing crossing the boundary is a directory of built files.
#
# (Aside on terminology: there is no "building inside Workers". Workers is the
# runtime; the hosted build service is part of Pages. What is being compared is
# where the build RUNS, not what serves the result.)
#
# The split below — a build job that holds no credential, and a deploy job that
# holds no code — is copied from the framework repository's docs deploy, along
# with the reasoning in its comments.

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Nightly, to recompute staleness. See reason 1 above: without this the site
    # silently ages.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `showLastUpdateTime` needs history; a shallow clone silently reports
          # every page as last updated at the checkout commit.
          fetch-depth: 0
          persist-credentials: false

      # The site does not exist yet. Rather than let this workflow fail on every
      # push until it does, every step below is gated on its presence — so this
      # file can land now and start working the moment `website/` appears.
      - name: Detect the site
        id: site
        run: |
          if [ -f website/package.json ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::notice::website/ does not exist yet; skipping build and deploy."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.site.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` installs the committed lockfile verbatim instead of re-resolving
      # it, and website/.npmrc sets ignore-scripts so no dependency lifecycle hook
      # runs on install.
      - name: Install
        if: steps.site.outputs.present == 'true'
        working-directory: website
        run: npm ci

      # Restored AFTER npm ci, not before: npm ci deletes node_modules, so a cache
      # restored earlier is thrown away and the step silently does nothing.
      - name: Restore build cache
        if: steps.site.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.cache
          key: site-cache-${{ hashFiles('website/package-lock.json') }}
          restore-keys: site-cache-

      - name: Typecheck
        if: steps.site.outputs.present == 'true'
        working-directory: website
        run: npm run typecheck

      # Deliberately duplicated from ci.yml rather than depended upon. The data
      # layer decides which numbers may be compared and which are struck through,
      # and a deploy that publishes a broken one is not recoverable by fixing CI
      # afterwards — the wrong page is already live.
      - name: Test
        if: steps.site.outputs.present == 'true'
        working-directory: website
        run: npm test

      - name: Build
        if: steps.site.outputs.present == 'true'
        working-directory: website
        env:
          # Mandatory, not cosmetic: the client-redirects plugin registers only
          # when CI is 'true', and a redirect whose target page was deleted is a
          # hard build failure. Without this, a broken redirect ships.
          CI: "true"
        run: npm run build

      # Two ceilings, both against Cloudflare limits, and the second is specific
      # to this site: result shards are files, and the archive only grows.
      - name: Guard file counts
        if: steps.site.outputs.present == 'true'
        run: |
          total=$(find website/build -type f | wc -l | tr -d ' ')
          echo "built files: $total"
          if [ "$total" -gt 18000 ]; then
            echo "::error::$total files, approaching Cloudflare's 20000 per-deployment limit"
            exit 1
          fi
          if [ -d website/build/bench ]; then
            shards=$(find website/build/bench -type f | wc -l | tr -d ' ')
            echo "result shards: $shards"
            if [ "$shards" -gt 4000 ]; then
              echo "::error::$shards result shards; re-shard by year before this hits the file ceiling"
              exit 1
            fi
          fi
          big=$(find website/build -type f -size +20M | wc -l | tr -d ' ')
          if [ "$big" -gt 0 ]; then
            echo "::error::$big file(s) over 20 MiB; Cloudflare rejects files above 25 MiB"
            exit 1
          fi

      # `if-no-files-found: error` is load-bearing. A build that silently produced
      # nothing would upload an empty artifact, and the deploy below would then
      # replace the live site with it.
      - name: Upload site
        if: steps.site.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: website/build
          if-no-files-found: error
          retention-days: 7

    outputs:
      present: ${{ steps.site.outputs.present }}

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.outputs.present == 'true' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    # The GitHub environment gating this job. Secrets are scoped to it, so
    # CLOUDFLARE_API_TOKEN is unreachable from any job that does not name it —
    # which is what keeps the build job above credential-free rather than merely
    # well-behaved.
    environment:
      name: production
      url: https://spate-benchmark.kainth.dev
    # Serialize production deploys; never cancel an in-progress publish.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # Deliberately has no `actions/checkout` and restores no cache. This is the
    # only job in the repository that holds a production credential, and it must
    # never share a workspace with repository code or with restored build state.
    # Keep it that way.
    steps:
      - name: Download site artifact
        # No `run-id:` and no `github-token:`, so the lookup is scoped to this
        # run and cannot reach an artifact built by any other workflow.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: website/build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        # This step runs its own `npm i wrangler` on the runner, and it does so
        # *after* setting CLOUDFLARE_API_TOKEN in the environment — an unlockfiled
        # install resolved fresh on every deploy, in an empty workspace where
        # website/.npmrc cannot reach it, with lifecycle scripts on and the
        # production token already in process.env.
        #
        # NPM_CONFIG_IGNORE_SCRIPTS closes that path the only way available here:
        # npm reads config from the environment, so this needs no file.
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # wrangler 3 is end-of-life, and Cloudflare gates the higher per-site
          # file ceiling on v4. Named rather than inherited from the action.
          wranglerVersion: "4"
          # --branch=main matches the project's production branch, so this
          # registers as a production deployment and not a preview.
          command: pages deploy website/build --project-name=spate-benchmark --branch=main
