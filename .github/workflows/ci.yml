# The gates this repository claims to have.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No third-party toolchain action. `rust-toolchain.toml` pins the channel
      # and its components, rustup is preinstalled on the runner, and `rustup
      # show` is what materialises the pin — so the compiler CI uses is the same
      # one the file names, with nothing else trusted to get that right. The pin
      # is provenance here rather than hygiene: codegen moves throughput.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
          cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # `--locked` throughout. A benchmark that cannot say which dependency graph
      # produced a number is not evidence, and a CI run that quietly updates the
      # lockfile is a CI run testing something other than what was committed.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      # The same command README.md tells a contributor to run locally, running
      # the same library code — not a second implementation of the checks that
      # could drift from the one a human invokes.
      - name: bench validate
        run: cargo run --quiet --locked -p spate-benchmark-harness --bin bench -- validate

      # A sweep is not runnable here, but the plan it would execute is, and a
      # selector grammar that silently expands to the whole matrix is the kind of
      # defect that costs hours on the machine that can run it. Once per
      # environment: with more than one profile committed, `--env` is mandatory
      # everywhere, and each environment's plan is checked on its own.
      - name: bench run --dry-run (m5max-mbp-docker)
        run: cargo run --quiet --locked -p spate-benchmark-harness --bin bench -- run '*' --dry-run --env m5max-mbp-docker

      - name: bench run --dry-run (c8g-8xl-ec2-docker)
        run: cargo run --quiet --locked -p spate-benchmark-harness --bin bench -- run '*' --dry-run --env c8g-8xl-ec2-docker

  # The AWS footprint is public HCL, so it gets the same treatment as the code:
  # formatted, validated, linted, and misconfiguration-scanned on every change.
  # Read-only by construction — no cloud credentials exist in this job, so it is
  # safe on a fork's pull request. Applying is a maintainer action from a
  # reviewed checkout, never CI (see infra/README.md).
  infra:
    name: Infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Format
        run: terraform fmt -check -recursive infra

      # The Inputs/Outputs tables in infra/README.md are generated; this fails
      # if a variable or output changed without the docs being regenerated
      # (`terraform-docs markdown table --output-file README.md
      # --output-mode inject infra`). Runs BEFORE `terraform init`: the
      # action's fail-on-diff refuses on ANY uncommitted file in the
      # workspace, and init writes .terraform.lock.hcl.
      - name: Docs are current
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: infra
          output-file: README.md
          output-method: inject
          fail-on-diff: "true"

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Lint
        working-directory: infra
        run: tflint --recursive

      # Trivy's config scanner is the successor of tfsec: static
      # misconfiguration checks (open security groups, unencrypted storage,
      # missing public-access blocks) against the HCL itself.
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          exit-code: "1"

      # Last, because init leaves provider lock files in the tree that the
      # docs action above would refuse.
      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `showLastUpdateTime` needs history; a shallow clone silently reports
          # every page as last updated at the checkout commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` installs the committed lockfile verbatim instead of re-resolving
      # it, and website/.npmrc sets ignore-scripts so no dependency lifecycle hook
      # runs on install.
      - name: Install
        working-directory: website
        run: npm ci

      - name: Typecheck
        working-directory: website
        run: npm run typecheck

      # The data layer decides which numbers may be compared, which may be
      # ranked, and which are struck through. Each of those was wrong at some
      # point and none had a test; these are the regression tests for them.
      - name: Test
        working-directory: website
        run: npm test

      - name: Build
        working-directory: website
        env:
          # Mandatory, not cosmetic: the client-redirects plugin registers only
          # when CI is 'true', and a redirect whose target page was deleted is a
          # hard build failure. Without this, a broken redirect ships.
          CI: "true"
        run: npm run build
