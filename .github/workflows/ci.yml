# The gates this repository claims to have.
#
# WHY THIS FILE EXISTS
#
# It did not, and six places said it did. `methodology/` stated that "CI
# asserts [the harness version table] stays in step with the constant in
# `harness/src/report.rs`"; `README.md` described `bench validate` as "what CI
# checks, runnable locally"; `.gitattributes` named a `results_are_valid` check
# as the backstop that makes `merge=union` on the results archive safe; the
# Spate descriptor claimed "a CI lint enforces that [nothing branches on the
# literal id], so the neutrality claim is checkable rather than asserted". The
# only workflow in the repository built the website.
#
# For a benchmark whose entire argument is that its numbers are checkable, a
# claimed guard that does not exist is worse than an absent one: it is the guard
# a reader is told to rely on instead of checking themselves.
#
# WHAT IS AND IS NOT GATED HERE
#
# Everything that can run without Docker and without hours of machine time. The
# measurement itself is not here and cannot be: a sweep takes hours on dedicated
# hardware, appends to a published archive, and is run deliberately by a
# maintainer rather than by a push. What CI can do is make sure the code that
# would take the measurement is correct, that every descriptor and every already
# published record still validates, and that the site renders the fairness
# contract it claims to.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No third-party toolchain action. `rust-toolchain.toml` pins the channel
      # and its components, rustup is preinstalled on the runner, and `rustup
      # show` is what materialises the pin — so the compiler CI uses is the same
      # one the file names, with nothing else trusted to get that right. The pin
      # is provenance here rather than hygiene: codegen moves throughput.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
          cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # `--locked` throughout. A benchmark that cannot say which dependency graph
      # produced a number is not evidence, and a CI run that quietly updates the
      # lockfile is a CI run testing something other than what was committed.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      # The same command README.md tells a contributor to run locally, running
      # the same library code — not a second implementation of the checks that
      # could drift from the one a human invokes.
      - name: bench validate
        run: cargo run --quiet --locked -p spate-benchmark-harness --bin bench -- validate

      # A sweep is not runnable here, but the plan it would execute is, and a
      # selector grammar that silently expands to the whole matrix is the kind of
      # defect that costs hours on the machine that can run it.
      - name: bench run --dry-run
        run: cargo run --quiet --locked -p spate-benchmark-harness --bin bench -- run '*' --dry-run

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `showLastUpdateTime` needs history; a shallow clone silently reports
          # every page as last updated at the checkout commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` installs the committed lockfile verbatim instead of re-resolving
      # it, and website/.npmrc sets ignore-scripts so no dependency lifecycle hook
      # runs on install.
      - name: Install
        working-directory: website
        run: npm ci

      - name: Typecheck
        working-directory: website
        run: npm run typecheck

      # The data layer decides which numbers may be compared, which may be
      # ranked, and which are struck through. Each of those was wrong at some
      # point and none had a test; these are the regression tests for them.
      - name: Test
        working-directory: website
        run: npm test

      - name: Build
        working-directory: website
        env:
          # Mandatory, not cosmetic: the client-redirects plugin registers only
          # when CI is 'true', and a redirect whose target page was deleted is a
          # hard build failure. Without this, a broken redirect ships.
          CI: "true"
        run: npm run build
