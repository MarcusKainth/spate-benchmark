schema = 1

[entrant]
id       = "vector"
name     = "Vector"
homepage = "https://vector.dev"
repo     = "https://github.com/vectordotdev/vector"
licence  = "MPL-2.0"
vendor   = "datadog"
kind     = "observability-pipeline"
language = ["rust"]
runtime  = "native"
# `planned` relaxes validation: no Dockerfile, no envelope, no variants required.
# It exists so the site can show what is not yet measured as a FILE rather than a
# promise in prose — a roadmap that CI checks and that cannot quietly rot.
status   = "planned"

[maintainer]
who = "spate-benchmark"
reviewed_upstream = false

[display]
order = 30
hue   = 150
short = "Vector"

[planned]
blockers = """
Two things must be settled before a Vector number is defensible.

Its `clickhouse` sink writes JSONEachRow; `arrow_stream` is the faster option and
is what a competent user would pick, so the arm must use it and the page must
report the format either way — JSONEachRow against RowBinary is not like-for-like
server-side work, and a results table that hides that is indefensible.

Vector has no Schema Registry integration: it takes a static inline schema with
`decoding.avro.strip_schema_id_prefix`. It therefore never pays a registry
lookup. That is negligible at steady state, since every arm caches, but it is a
difference in what is being executed and must be disclosed rather than absorbed.

Vector is Rust with the same no-GC story as Spate and may well beat us. That is a
reason to run it, not a reason to defer it.
"""
