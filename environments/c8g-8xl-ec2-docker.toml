# The cloud environment — the gold standard once its first sweep lands.
#
# One on-demand EC2 c8g.8xlarge, launched fresh per run by the pipeline in
# .github/workflows/bench-launch.yml and terminated when the run ends, so no
# state survives between measurements. Graviton4 has no SMT: the 32 vCPUs are
# 32 physical cores, homogeneous, which removes both objections that made the
# retired macOS environment indicative (a hypervisor mapping vCPUs across
# heterogeneous cores, and a Docker Desktop VM between the harness and the
# kernel). Docker here is Docker CE on Linux — containers are plain cgroups,
# the same mechanism the envelope enforcement and the sampler already read.
#
# `env_digest` on every record is a hash of this file, so editing it later
# cannot retroactively re-describe runs that already happened.

id = "c8g-8xl-ec2-docker"

# The site removes its "not authoritative" banner from THIS field. What earns
# it: bare Linux, homogeneous physical cores, a fresh machine per run, and an
# instance type anyone can rent.
class = "authoritative"

[host]
description = "AWS EC2 c8g.8xlarge, EBS gp3 500 GiB (10,000 IOPS, 1,000 MiB/s)"
cpu         = "AWS Graviton4"
cores       = 32
core_layout = "homogeneous: 32 physical cores, no SMT"
memory      = "64 GiB"
os          = "Ubuntu 24.04, Docker CE"
arch        = "aarch64"

caveats = """
Storage is EBS gp3, not local NVMe — c8g has no instance store. The volume is
provisioned at 10,000 IOPS and 1,000 MiB/s, deliberately above anything the
workload sustains, so the disk is headroom rather than a variable; the exact
provisioning is part of this profile because changing it would change what is
being measured. The instance-level EBS ceiling (10 Gbps) sits above the
volume's, so the volume is the binding and recorded limit.

This is a virtualised single-tenant instance, not bare metal: the Nitro
hypervisor is present but does not oversubscribe CPU, and every vCPU is a
dedicated physical core. A `*.metal` environment would remove the hypervisor
entirely; nothing measured so far suggests it would move these numbers.
"""

# Shared infrastructure. OUTSIDE every arm's envelope and identical for all of
# them. This split is the output of a measured search on this instance type
# (2026-07-30, tuning session on a live c8g.8xlarge):
#
#   - The broker cap was swept against the consume ceiling: 3 cpus is the
#     smallest allocation that does not constrain it (2 cpus costs 24% of the
#     ceiling — Redpanda runs one reactor shard per core, and 2 shards cannot
#     serve 8 partitions at full rate even with the cgroup far under its cap;
#     4 cpus measures identically to 3).
#   - ClickHouse ingest scales near-linearly with cores through every count
#     probed (9 -> 18), pegged at 101% of its cap and CFS-throttled at every
#     winning rung — so its allocation is bounded by the host budget, not by
#     diminishing returns: 16 cpus is what remains beside the 6-cpu arm
#     envelope, the broker, and the driver/sampler on a 32-core host.
#
# Any change to these caps moves `infra_digest` and requires re-measuring
# ceilings before anything publishes, because `Ceilings::gate` drops any
# ceiling whose recorded envelope is not this one.
[infra]
partitions = 8

[infra.broker]
kind     = "redpanda"
image    = "redpandadata/redpanda:v26.1.13"
cpus     = "3"
memory   = "8g"
registry = "redpanda-builtin"

[infra.clickhouse]
image  = "clickhouse/clickhouse-server:26.3"
cpus   = "16"
memory = "16g"

# Measured on this environment by the pipeline's ceiling-bootstrap mode
# (`bench ceiling --measure --write --env c8g-8xl-ec2-docker` on the box);
# the collector commits the result back to this file's PR. An arm above 70%
# of the measured ceiling is infra-bound and cannot be published.
[ceiling]
file = "ceilings/c8g-8xl-ec2-docker.json"
