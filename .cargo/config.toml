# The framework is fetched from a private repository until it publishes. Cargo's
# built-in git transport does not use git's credential helpers, so a private
# dependency fails to fetch with an opaque authentication error; shelling out to
# the git CLI picks up whatever credential helper is already configured (on this
# machine, the GitHub CLI's).
#
# Delete this file when the framework's crates are on crates.io — at that point
# there is no git dependency left to authenticate.
[net]
git-fetch-with-cli = true
